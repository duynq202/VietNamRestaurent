<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#382820" />
  <meta name="description" content="Quán Cơm Nhà — prototype mobile web, nhà hàng pixel Việt Nam." />
  <title>Quán Cơm Nhà • P1 REVISION</title>
  <style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#fef4db;background:#392821;font-synthesis:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff2b0;outline-offset:3px}
.game-shell{width:100vw;height:100vh;height:100dvh;min-height:350px;position:relative;overflow:hidden;isolation:isolate;background:#c68b57}
#restaurant-canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.scene-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#231d186b 0,#3024171f 19%,transparent 38%,transparent 73%,#33201573 100%)}
.reserved-events{position:absolute;top:calc(140px + env(safe-area-inset-top,0px));left:10px;width:clamp(38px,12vw,94px);height:40%;pointer-events:none} /* intentionally empty: event rail reserved */
.service-hud{position:absolute;top:calc(13px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:10px 14px;min-height:61px;white-space:nowrap;background:linear-gradient(180deg,#664a37f7,#382b24f7);border:2px solid #d1a66c;border-bottom:4px solid #91663f;border-radius:14px;box-shadow:0 5px 0 #261a16a3,0 9px 26px #1c171a63;z-index:2}
.service-symbol{font-size:25px;filter:drop-shadow(1px 2px 0 #211b17)}
.service-copy{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.microtext{font-size:9px;color:#d9bd95;letter-spacing:.9px;font-weight:900}
.service-copy strong{font-size:17px;line-height:1.1;color:#fff2d1;font-weight:950}
.service-copy strong small{font-size:11px;font-weight:800;color:#f3cd89}
.service-divider{width:1px;height:32px;background:#a48969}
.player-hud{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:7px;z-index:3}
.player-top{display:flex;gap:8px;align-items:center;min-width:160px;max-width:245px;padding:5px 10px 5px 5px;border-radius:13px;background:#38251fe8;border:2px solid #b98a56;box-shadow:0 4px 0 #211713a8}
.avatar{width:41px;height:41px;border:2px solid #ffe0a3;background:#a6cda9;border-radius:10px;display:grid;place-items:center;flex-shrink:0}.avatar span{font-size:26px}
.player-details{display:flex;flex-direction:column;gap:0;min-width:0}.player-details>span{font-size:8px;letter-spacing:1px;color:#e9b97b;font-weight:900}.player-details strong{font-size:12px;white-space:nowrap}.player-details small{font-size:10px;color:#ffe8ae;font-weight:850}.player-details em{font-style:normal;font-size:7px;padding:2px 4px;background:#bf7850;border-radius:3px;color:#fff}
.coin-pill{display:flex;align-items:center;gap:7px;min-width:139px;min-height:40px;padding:5px 7px 5px 7px;background:linear-gradient(180deg,#63462f,#3d2923);border:2px solid #e5b66e;border-radius:12px;box-shadow:0 4px 0 #26171199}
.coin-icon{font-size:18px;display:grid;place-items:center;width:26px;height:26px;background:#ffd16d;color:#87502d;border:2px solid #ffedaf;border-radius:50%;box-shadow:inset 0 -3px 0 #dc9440}
.coin-copy{display:flex;flex:1;flex-direction:column;line-height:1.13}.coin-copy small{font-size:8px;letter-spacing:.5px;color:#eed29c;font-weight:850}.coin-copy strong{font-size:17px;color:#fff5cc;font-variant-numeric:tabular-nums}.coin-plus{display:grid;place-items:center;background:#60916d;color:#fcffe1;border-radius:7px;width:23px;height:23px;font-weight:950}
.game-actions{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:48%;transform:translateY(-36%);display:flex;flex-direction:column;gap:11px;z-index:4}
.action-btn{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;width:77px;min-height:78px;padding:8px 3px 6px;background:linear-gradient(145deg,#ffe6a9,#dca96c);border:3px solid #70432f;border-bottom-width:5px;border-radius:13px;box-shadow:3px 5px 0 #3f2a25b3,0 12px 21px #3223173b;color:#603c2b;font-size:11px;font-weight:950;line-height:1.1;transition:transform .1s,filter .1s}
.action-btn:active{transform:translateY(3px);box-shadow:2px 2px 0 #3f2a25b3}.action-btn[aria-expanded="true"]{background:#f8c77f;border-color:#a95b36}.action-icon{width:43px;height:42px;border:2px solid #c78b52;border-radius:10px;display:grid;place-items:center;background:#fff2cb;font-size:27px;filter:drop-shadow(0 1px 0 #fff)}
.bottom-hud{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px));right:calc(110px + env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;z-index:2;font-size:10px;font-weight:900}
.mock-pill,.earned-pill{display:inline-flex;align-items:center;gap:5px;padding:8px 10px;border-radius:8px;background:#382921db;border:1px solid #c79b65;color:#ffe9bf;box-shadow:0 3px 0 #3521168a;white-space:nowrap}
.earned-pill{color:#e4c9a2}.earned-pill strong{color:#fff3bd}.status-light{display:inline-block;background:#8de4a2;width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px #8de4a2}
.panel-backdrop{position:absolute;inset:0;z-index:6;background:#201713a6;backdrop-filter:blur(2px)}
.feature-dialog{position:absolute;z-index:7;right:calc(13px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:min(360px,calc(100vw - 28px));max-height:min(75dvh,640px);background:#f5e5ca;color:#523628;border:4px solid #714630;border-bottom-width:7px;border-radius:18px;box-shadow:0 13px 0 #291d17ad,0 22px 65px #180d09ad;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
.dialog-header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#784739;color:#fff2d8;padding:15px 15px 13px;border-bottom:4px solid #d9a46d}.dialog-eyebrow{font-size:9px;letter-spacing:1.1px;color:#f6c992;font-weight:850}.dialog-header h1{font-size:21px;margin:4px 0 0;font-weight:950}.close-btn{flex-shrink:0;width:42px;height:42px;border:2px solid #f4d39f;border-radius:10px;background:#a9624b;color:white;font-size:19px;font-weight:bold}
.detail-panel{padding:16px;overflow:auto;overscroll-behavior:contain;min-height:100px}
.panel-disclaimer{margin:0;padding:10px 15px;background:#e8d1b2;color:#80654c;border-top:1px solid #d4b993;font-size:10px;line-height:1.35}
.upgrade-card{display:flex;align-items:center;gap:11px;text-align:left;width:100%;border:2px solid #dfbd90;border-bottom-width:4px;border-radius:12px;background:#fff8e7;padding:10px;margin-bottom:10px;color:#58392d}.upgrade-card:active:enabled{transform:translateY(2px);border-bottom-width:2px}.upgrade-card:disabled{opacity:.65;cursor:not-allowed}.upgrade-icon{width:49px;height:49px;background:#f8dcaa;border:2px solid #e7ba7e;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:26px}.upgrade-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.upgrade-copy strong{font-size:13px}.upgrade-copy small{font-size:10px;color:#986d4e}.upgrade-copy>span{font-size:11px;color:#977359}.upgrade-copy em{font-size:10px;color:#3f7c64;font-style:normal;font-weight:850}.upgrade-price{background:#a75a3f;color:#fff2dc;border-radius:8px;padding:7px;font-size:11px;font-weight:900;white-space:nowrap}
.dish-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dish-grid>div{background:#fff7e5;border:2px solid #dcb78b;border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:3px}.dish-grid>div>span{font-size:30px}.dish-grid strong{font-size:13px}.dish-grid small{font-size:10px;color:#957459}.smallnote,.explain{font-size:12px;line-height:1.6;color:#765c46}.explain p{margin:0 0 12px}.explain p:last-child{margin:0}
.toast{position:absolute;z-index:10;bottom:calc(72px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:#372820;border:2px solid #d6a86e;border-radius:11px;padding:11px 15px;color:#fff0d1;text-align:center;font-size:12px;font-weight:800;max-width:min(340px,90vw)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:730px){.service-hud{top:calc(125px + env(safe-area-inset-top,0px));padding:8px 10px;min-height:52px;gap:7px}.service-symbol{font-size:21px}.service-copy strong{font-size:15px}.microtext{font-size:8px}.player-top{min-width:151px}.game-actions{top:auto;bottom:calc(73px + env(safe-area-inset-bottom,0px));transform:none;gap:8px}.action-btn{width:70px;min-height:71px;font-size:10px}.action-icon{width:37px;height:36px;font-size:22px}.bottom-hud{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:85px}.feature-dialog{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:none;max-height:min(71dvh,570px);right:10px;width:min(375px,calc(100vw - 20px))}}
@media(max-width:370px){.service-hud{left:50%;transform:translateX(-50%);gap:5px}.service-symbol{display:none}.service-copy strong{font-size:13px}.player-top{min-width:143px}.avatar{width:34px;height:34px}.avatar span{font-size:21px}.player-details strong{font-size:11px}.coin-pill{min-width:126px}.game-actions{right:7px}.action-btn{width:66px}.bottom-hud{left:7px}.mock-pill,.earned-pill{font-size:9px;padding:6px}}
@media(max-height:590px){.game-actions{top:auto;bottom:45px;right:15px;transform:none;flex-direction:row}.action-btn{min-height:55px;width:65px;padding:4px;font-size:9px}.action-icon{height:24px;width:27px;font-size:17px}.service-hud{top:8px;left:50%;transform:translateX(-50%)}.feature-dialog{max-height:88dvh}.bottom-hud{right:240px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-height:590px) and (max-width:730px){.service-hud{top:calc(122px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%)}}

</style>
  
</head>
<body>
  <main class="game-shell" aria-label="Màn chơi Quán Cơm Nhà">
    <canvas id="restaurant-canvas" aria-label="Quán ăn Việt Nam góc nhìn thẳng, sàn gạch chữ nhật, quầy phục vụ ở phía trên, khách và bàn ghế ở giữa nhà hàng" role="img">Trình duyệt của bạn cần hỗ trợ Canvas.</canvas>
    <div class="scene-shade" aria-hidden="true"></div>

    <!-- LEFT CORRIDOR: deliberately empty for future event buttons. -->
    <div class="reserved-events" aria-hidden="true"></div>

    <div class="service-hud" aria-label="Thông tin phục vụ">
      <div class="service-symbol" aria-hidden="true">🍽️</div>
      <div class="service-copy"><span class="microtext">ĐANG PHỤC VỤ</span><strong><span id="capacity">2</span> chỗ</strong></div>
      <div class="service-divider" aria-hidden="true"></div>
      <div class="service-copy"><span class="microtext">THU NHẬP</span><strong>+<span id="rate">4</span> <small>xu/giây</small></strong></div>
    </div>

    <div class="player-hud" aria-label="Thông tin người chơi và tiền demo">
      <div class="player-top">
        <div class="avatar" aria-hidden="true"><span>👩🏻‍🍳</span></div>
        <div class="player-details"><span>CHỦ QUÁN</span><strong>Đầu Bếp Nhỏ</strong><small>LV. 1 <em>DEMO</em></small></div>
      </div>
      <div class="coin-pill"><span class="coin-icon" aria-hidden="true">✦</span><span class="coin-copy"><small>XU GIẢ LẬP</small><strong id="coins">680</strong></span><span class="coin-plus" aria-hidden="true">+</span></div>
    </div>

    <nav class="game-actions" aria-label="Các chức năng trong màn chơi">
      <button type="button" class="action-btn" data-panel="upgrades" aria-haspopup="dialog" aria-controls="feature-dialog" aria-expanded="false"><span class="action-icon" aria-hidden="true">🔨</span><span>Nâng cấp</span></button>
      <button type="button" class="action-btn" data-panel="dishes" aria-haspopup="dialog" aria-controls="feature-dialog" aria-expanded="false"><span class="action-icon" aria-hidden="true">🍜</span><span>Thực đơn</span></button>
      <button type="button" class="action-btn" data-panel="about" aria-haspopup="dialog" aria-controls="feature-dialog" aria-expanded="false"><span class="action-icon" aria-hidden="true">⚙️</span><span>Thông tin</span></button>
    </nav>

    <div class="bottom-hud"><span class="mock-pill"><span class="status-light"></span> MÔ PHỎNG TỰ ĐỘNG</span><span class="earned-pill">Đã kiếm: <strong><span id="earning">0</span> xu</strong></span></div>

    <div id="panel-backdrop" class="panel-backdrop" hidden></div>
    <section id="feature-dialog" class="feature-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1" hidden>
      <header class="dialog-header"><div><span class="dialog-eyebrow">QUÁN CƠM NHÀ • P1 DEMO</span><h1 id="dialog-title">Nâng cấp nhà hàng</h1></div><button id="close-panel" class="close-btn" type="button" aria-label="Đóng bảng chức năng">✕</button></header>
      <div id="detail-panel" class="detail-panel"></div>
      <p class="panel-disclaimer">Tiền và tiến trình chỉ là giả lập; tải lại trang sẽ đặt lại dữ liệu.</p>
    </section>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true" class="toast"></div>
  </main>
<script>
(()=>{
function newDemoState(initialTimeMs = 0) {
    return { demoCoins: 680, earned: 0, kitchenLevel: 1, tableLevel: 1, ratePerSecond: 4, customerCapacity: 2, lastTickMs: initialTimeMs };
}
function upgradeSpec(state, id) {
    if (id === 'kitchen') {
        return { id, cost: 120 * state.kitchenLevel, label: 'Bếp nhà', nextEffect: '+2 xu demo / giây' };
    }
    return { id, cost: 170 * state.tableLevel, label: 'Bàn ghế', nextEffect: '+1 chỗ phục vụ' };
}
function advanceDemo(state, nowMs) {
    if (!Number.isFinite(nowMs) || nowMs <= state.lastTickMs)
        return state;
    // Frame-level animation ticks are capped: closing the tab does NOT grant offline rewards.
    const seconds = Math.max(0, Math.min((nowMs - state.lastTickMs) / 1000, 0.25));
    const payout = seconds * state.ratePerSecond;
    return { ...state, lastTickMs: Math.max(state.lastTickMs, nowMs), demoCoins: state.demoCoins + payout, earned: state.earned + payout };
}
function buyDemoUpgrade(state, id) {
    if (id === 'tables' && state.tableLevel >= 3 || id === 'kitchen' && state.kitchenLevel >= 5)
        return { ok: false, reason: 'MAX_LEVEL', state };
    const { cost } = upgradeSpec(state, id);
    if (state.demoCoins < cost)
        return { ok: false, reason: 'INSUFFICIENT_DEMO_COINS', state };
    return {
        ok: true,
        state: { ...state, demoCoins: state.demoCoins - cost,
            kitchenLevel: state.kitchenLevel + Number(id === 'kitchen'),
            tableLevel: state.tableLevel + Number(id === 'tables'),
            ratePerSecond: state.ratePerSecond + (id === 'kitchen' ? 2 : 0),
            customerCapacity: state.customerCapacity + (id === 'tables' ? 1 : 0) }
    };
}

/** Frontal orthographic restaurant. Horizontal back wall + rectangular floor grid.
 *  Logical height is fixed, width follows viewport aspect ratio; no distorted art. */
const WORLD_HEIGHT = 1080;
const r = (c, color, x, y, w, h) => { c.fillStyle = color; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const outline = (c, x, y, w, h, fill, border = '#704631', th = 5) => {
    r(c, border, x, y, w, h);
    r(c, fill, x + th, y + th, w - th * 2, h - th * 2);
};
const label = (c, value, x, y, size = 17, color = '#fff0cf') => { c.font = `900 ${size}px system-ui`; c.fillStyle = color; c.textAlign = 'center'; c.fillText(value, x, y); };
function line(c, col, x, y, x2, y2, width = 3) { c.strokeStyle = col; c.lineWidth = width; c.beginPath(); c.moveTo(x, y); c.lineTo(x2, y2); c.stroke(); }
function shadow(c, x, y, w, h) { c.fillStyle = '#563a2e35'; c.beginPath(); c.ellipse(x, y, w, h, 0, 0, Math.PI * 2); c.fill(); }
function tileFloor(c, half) {
    const left = -half;
    r(c, '#8b5141', left, 453, half * 2, 17);
    r(c, '#e5b27a', left, 470, half * 2, 610);
    // Straight-on rectangular tiles; no diagonal/isometric diamond.
    for (let row = 0; row < 16; row++) {
        const top = 470 + row * 40;
        const offset = (row % 2) * 44;
        for (let x = left - 90 + offset; x < half + 90; x += 88) {
            r(c, ((row + Math.floor(x / 88)) % 3 === 0) ? '#f1c994' : '#e9b982', x + 2, top + 2, 84, 35);
            r(c, '#fff0bb30', x + 4, top + 3, 79, 3);
        }
        r(c, '#ca946d', left, top + 38, half * 2, 2);
    }
    // runner rug in front, rectangular not diagonal
    shadow(c, 0, 956, 155, 42);
    outline(c, -147, 916, 294, 104, '#8e483d', '#65382e', 8);
    outline(c, -122, 933, 244, 65, '#d78554', '#f0b277', 6);
    label(c, 'CHÀO MỪNG', 0, 976, 20, '#ffe5ab');
}
function wall(c, half) {
    r(c, '#cf8f61', -half, 0, half * 2, 475);
    for (let x = -half - 6; x < half + 6; x += 76) {
        r(c, Math.round(x / 76) % 2 ? '#e7b47d' : '#e3ab73', x, 0, 72, 450);
        r(c, '#f3c58a29', x + 4, 0, 7, 448);
    }
    r(c, '#794a38', -half, 0, half * 2, 45);
    r(c, '#f3ce8a', -half, 45, half * 2, 11);
    r(c, '#5c372f', -half, 110, half * 2, 22);
    r(c, '#af6b4b', -half, 131, half * 2, 11);
    for (let y = 160; y < 450; y += 66)
        r(c, '#f0c38d22', -half, y, half * 2, 4);
    r(c, '#704938', -half, 441, half * 2, 26);
    r(c, '#ecc48f', -half, 466, half * 2, 8);
    // top fascia edge / festoon lights
    for (let x = -half + 25; x < half; x += 66) {
        r(c, '#f7d6a9', x, 121, 6, 6);
        r(c, '#d17a4b', x - 5, 130, 16, 5);
    }
}
function drawWindow(c, x, y, w, h) {
    outline(c, x, y, w, h, '#bfe1cf', '#764a38', 9);
    r(c, '#b8dcca', x + 12, y + 12, w - 24, h - 24);
    r(c, '#f1edb8', x + 15, y + 14, w - 30, 38);
    r(c, '#9abea3', x + 15, y + 58, w - 30, h - 73);
    for (let dx = 0; dx < w - 30; dx += 27)
        r(c, '#7eaa91', x + 17 + dx, y + 105 + Math.sin(dx) * 10, 19, h - 123);
    r(c, '#7c4c39', x + w / 2 - 5, y, 10, h);
    r(c, '#7c4c39', x, y + h * .51, w, 9);
    r(c, '#e6a469', x - 7, y + h, w + 14, 14);
}
function sign(c, time) {
    // The sign hangs beneath the centered service HUD on narrow phone screens.
    // Its lettering stays legible instead of sitting underneath a UI overlay.
    r(c, '#61392f', -165, 261, 330, 70);
    outline(c, -156, 266, 312, 61, '#93483a', '#f5c876', 7);
    r(c, '#663830', -144, 277, 288, 38);
    label(c, 'QUÁN CƠM NHÀ', 0, 306, 31, '#fff0c9');
    if (Math.floor(time / 800) % 2 === 0) {
        r(c, '#fff7d0', -151, 269, 6, 6);
        r(c, '#fff7d0', 145, 315, 6, 6);
    }
}
function lantern(c, x, y, shift) {
    r(c, '#55352e', x - 2, y - 45, 4, 46);
    r(c, '#f3ce86', x - 22, y - 2 + shift, 44, 8);
    r(c, '#bb593e', x - 24, y + 6 + shift, 48, 51);
    r(c, '#e48e54', x - 15, y + 7 + shift, 30, 48);
    r(c, '#ffd397', x - 4, y + 12 + shift, 8, 41);
    r(c, '#f1c27d', x - 22, y + 56 + shift, 44, 6);
    r(c, '#704337', x - 2, y + 61 + shift, 4, 15);
    r(c, '#efbd70', x - 4, y + 75 + shift, 8, 9);
}
function menuBoard(c, x, y) {
    outline(c, x, y, 142, 170, '#31544b', '#74503c', 9);
    label(c, 'MÓN NGON', x + 71, y + 40, 17, '#ffe7ab');
    for (let i = 0; i < 4; i++) {
        r(c, '#e4ca8f', x + 18, y + 57 + i * 23, 66 + i % 2 * 8, 3);
        r(c, '#dfba78', x + 101, y + 57 + i * 23, 22, 3);
    }
}
function planter(c, x, y, s = 1) {
    c.save();
    c.translate(x, y);
    c.scale(s, s);
    shadow(c, 0, 2, 33, 10);
    outline(c, -26, -52, 52, 53, '#c5764b', '#754734', 5);
    r(c, '#eaa068', -21, -43, 42, 7);
    r(c, '#446b40', -4, -121, 8, 68);

function hangingLight(c, x) {
    r(c, '#4c362d', x - 2, 0, 4, 193);

class RestaurantScene {
    canvas;
    ctx;
    width = 800;
    height = WORLD_HEIGHT;
    constructor(canvas) {
        this.canvas = canvas;
        const context = canvas.getContext('2d', { alpha: false });
        if (!context)
            throw new Error('Canvas2D unsupported');
        this.ctx = context;
        this.resize();
    }
    resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = Math.max(1, Math.round(this.canvas.clientWidth * dpr));
        this.canvas.height = Math.max(1, Math.round(this.canvas.clientHeight * dpr));
        this.width = WORLD_HEIGHT * this.canvas.width / this.canvas.height;
        this.height = WORLD_HEIGHT;
        this.ctx.imageSmoothingEnabled = false;
    }
    render(now, state) {
        const c = this.ctx;
        const half = this.width / 2;
        const scale = this.canvas.height / WORLD_HEIGHT;
        c.setTransform(scale, 0, 0, scale, this.canvas.width / 2, 0);
        wall(c, half);
        tileFloor(c, half);
        // Decoration is placed around the wall; front-facing parallel lines throughout.
        drawWindow(c, -half + 32, 185, Math.max(105, Math.min(210, half - 218)), 223);
        drawWindow(c, half - Math.max(105, Math.min(210, half - 218)) - 32, 185, Math.max(105, Math.min(210, half - 218)), 223);
        hangingLight(c, -Math.min(342, half * .68));
        hangingLight(c, Math.min(342, half * .68));
        lantern(c, -Math.min(235, half * .72), 235, Math.round(Math.sin(now / 1200) * 2));
        lantern(c, Math.min(235, half * .72), 235, Math.round(Math.cos(now / 1200) * 2));
        sign(c, now);
        if (half > 620) {
            menuBoard(c, -520, 247);
            menuBoard(c, 382, 247);
        }
        serviceCounter(c, now, state.kitchenLevel);
        planter(c, -Math.min(340, half - 50), 519, .95);
        planter(c, Math.min(340, half - 50), 519, .95);
        // Furniture draws in painter order from back to front.
        diningTable(c, -Math.min(168, half * .39), 666, .85, true);
        diningTable(c, Math.min(168, half * .39), 731, .83, true);
        person(c, -Math.min(153, half * .36), 631, '#6d9d80', '#3e332b', now, 0.8);
        person(c, Math.min(178, half * .40), 689, '#bc6550', '#3e332b', now + 700, .76);
        if (state.tableLevel >= 2) {
            diningTable(c, -Math.min(155, half * .37), 861, .83, true);
            person(c, -Math.min(190, half * .43), 805, '#6788b2', '#49332e', now + 200, .75);
        }
        if (state.tableLevel >= 3) {
            diningTable(c, Math.min(145, half * .35), 912, .73, true);
        }
        if (half > 700) {
            diningTable(c, -520, 775, .84, true);
            diningTable(c, 520, 745, .85, true);
        }
        // Visual-only visitor; rendered separately from simulated earnings.
        const progress = (now / 4200) % 1;
        const destination = state.tableLevel >= 2 ? -100 : 115;
        const walk = progress < .73 ? progress / .73 : 1;
        const visitorX = (1 - walk) * 0 + walk * destination;
        const visitorY = (1 - walk) * 1055 + walk * 794;
        person(c, visitorX, visitorY, '#dcad68', '#51352f', now * 1.6, .88);
        // Gentle sparkling service feedback visual (no game economy impact)
        if ((now / 1100) % 3 < .5) {
            r(c, '#ffe5a6', 205, 353, 7, 7);
            r(c, '#fff7ca', 209, 346, 3, 22);
        }
    }
}

const $ = (selector) => {
    const element = document.querySelector(selector);
    if (!element)
        throw new Error(`Missing element: ${selector}`);
    return element;
};
const canvas = $('#restaurant-canvas');
const scene = new RestaurantScene(canvas);
const coins = $('#coins');
const earning = $('#earning');
const rate = $('#rate');
const capacity = $('#capacity');
const panel = $('#detail-panel');
const dialog = $('#feature-dialog');
const dialogTitle = $('#dialog-title');
const backdrop = $('#panel-backdrop');
const closeButton = $('#close-panel');
const toasts = $('#toast');
const panelButtons = [...document.querySelectorAll('[data-panel]')];
let state = newDemoState(performance.now());
let activePanel = null;
let activeOpener = null;
let lastUI = 0;
let lastPanelSignature = '';
let toastTimer;
let reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const format = (value) => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 }).format(Math.floor(value));
function notify(message) {
    toasts.textContent = message;
    toasts.classList.add('show');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => toasts.classList.remove('show'), 2600);
}
function closePanel() {
    if (!activePanel)
        return;
    activePanel = null;
    dialog.hidden = true;
    backdrop.hidden = true;
    panelButtons.forEach(button => button.setAttribute('aria-expanded', 'false'));
    activeOpener?.focus();
    activeOpener = null;
}
function openPanel(name, opener) {
    if (activePanel === name) {
        closePanel();
        return;
    }
    activePanel = name;
    activeOpener = opener;
    dialogTitle.textContent = name === 'upgrades' ? 'Nâng cấp nhà hàng' : name === 'dishes' ? 'Thực đơn Việt' : 'Về bản prototype';
    dialog.hidden = false;
    backdrop.hidden = false;
    panelButtons.forEach(button => button.setAttribute('aria-expanded', String(button === opener)));
    renderPanel();
    closeButton.focus();
}
function makeUpgrade(id, icon, description) {
    const spec = upgradeSpec(state, id);
    const level = id === 'kitchen' ? state.kitchenLevel : state.tableLevel;
    const maxed = id === 'kitchen' ? level >= 5 : level >= 3;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'upgrade-card';
    button.disabled = maxed || state.demoCoins < spec.cost;
    button.innerHTML = `<span class="upgrade-icon" aria-hidden="true">${icon}</span><span class="upgrade-copy"><strong>${spec.label} <small>Lv.${level}</small></strong><span>${description}</span><em>${maxed ? 'Đã nâng cấp tối đa' : spec.nextEffect}</em></span><span class="upgrade-price">${maxed ? 'MAX' : `${format(spec.cost)} ✦`}</span>`;
    button.addEventListener('click', () => {
        const result = buyDemoUpgrade(state, id);
        if (result.ok) {
            state = result.state;
            renderUI();
            notify(`Nâng cấp ${spec.label} thành công (demo).`);
        }
        else
            notify(result.reason === 'MAX_LEVEL' ? 'Đã đạt mức tối đa.' : 'Không đủ xu giả lập.');
    });
    return button;
}
function panelSignature() {
    return `${activePanel}|${state.kitchenLevel}|${state.tableLevel}|${state.demoCoins >= upgradeSpec(state, 'kitchen').cost}|${state.demoCoins >= upgradeSpec(state, 'tables').cost}`;
}
function renderPanel() {
    lastPanelSignature = panelSignature();
    panel.replaceChildren();
    if (activePanel === 'upgrades') {
        panel.append(makeUpgrade('kitchen', '🍳', 'Tăng tốc độ phục vụ'), makeUpgrade('tables', '🪑', 'Thêm chỗ phục vụ'));
    }
    else if (activePanel === 'dishes') {
        panel.innerHTML = '<div class="dish-grid"><div><span>🍲</span><strong>Phở bò</strong><small>Món nước truyền thống</small></div><div><span>🥖</span><strong>Bánh mì</strong><small>Bánh mì kẹp</small></div><div><span>🍚</span><strong>Cơm tấm</strong><small>Món cơm bình dân</small></div><div><span>☕</span><strong>Cà phê sữa</strong><small>Thức uống quen thuộc</small></div></div><p class="smallnote">Món ăn chỉ minh họa giao diện, chưa phải catalog được duyệt.</p>';
    }
    else if (activePanel === 'about') {
        panel.innerHTML = '<div class="explain"><p>Đây là bản <strong>P1 REVISION</strong> của trò chơi Quán Cơm Nhà. Giao diện toàn màn hình, các nút chức năng nằm trong màn chơi, và sàn nhà nhìn thẳng.</p><p><strong>Ô bên trái được để trống</strong> cho các nút sự kiện trong tương lai. Level người chơi hiện là nhãn minh họa, chưa có hệ thống XP.</p><p>Doanh thu, xu và nâng cấp là dữ liệu giả lập trong bộ nhớ. Chưa có tài khoản, lưu server, multiplayer, premium hay thanh toán.</p></div>';
    }
}
function renderUI() {
    coins.textContent = format(state.demoCoins);
    earning.textContent = format(state.earned);
    rate.textContent = String(state.ratePerSecond);
    capacity.textContent = String(state.customerCapacity);
    if (activePanel === 'upgrades' && panelSignature() !== lastPanelSignature)
        renderPanel();
}
function loop(time) {
    state = advanceDemo(state, time);
    if (!document.hidden)
        scene.render(reduceMotion ? 0 : time, state);
    if (time - lastUI > 250) {
        renderUI();
        lastUI = time;
    }
    requestAnimationFrame(loop);
}
panelButtons.forEach(button => button.addEventListener('click', () => openPanel(button.dataset.panel, button)));
closeButton.addEventListener('click', closePanel);
backdrop.addEventListener('click', closePanel);
document.addEventListener('keydown', event => {
    if (event.key === 'Escape')
        closePanel();
    if (event.key === 'Tab' && activePanel) {
        const focusable = [...dialog.querySelectorAll('button:not(:disabled), [href], [tabindex]:not([tabindex="-1"])')];
        if (!focusable.length)
            return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
        }
        else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
        }
    }
});
window.addEventListener('resize', () => scene.resize());
window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', event => reduceMotion = event.matches);
window.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
        state = { ...state, lastTickMs: performance.now() };
        scene.resize();
    }
});
renderUI();
requestAnimationFrame(loop);

})();
</script>
